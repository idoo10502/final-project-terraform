## The pipeline (contracts P1-P11). Fill it in. Until it has on: and jobs:, GitHub shows it as an invalid workflow
name: deploy

on:
  pull_request:
    branches: [main]
    paths: ["services/**", "infra/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["services/**", "infra/**", ".github/workflows/**"]

permissions:
  id-token: write # OIDC
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VERSION: "1.10.5"

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive -no-color
      - run: terraform init -backend=false -input=false -no-color
      - run: terraform validate -no-color

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [vote, result, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: exists
        name: tag already in ECR?
        run: |
          if aws ecr describe-images \
               --repository-name "${{ vars.NAME_PREFIX }}-${{ matrix.service }}" \
               --image-ids imageTag=${{ github.sha }} >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.found != 'true'
      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.found != 'true'
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }} # PR: build only
          tags: ${{ steps.ecr.outputs.registry }}/${{ vars.NAME_PREFIX }}-${{ matrix.service }}:${{ github.sha }}

  plan:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=voting-app/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"
      - run: |
          terraform plan -input=false -no-color -lock-timeout=5m \
            -var-file=envs/${{ matrix.env }}.tfvars \
            -var="name_prefix=${{ vars.NAME_PREFIX }}" \
            -var="image_tag=${{ github.sha }}"

  deploy-dev:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: dev
      image_tag: ${{ github.sha }}

  deploy-prod:
    if: github.event_name == 'push'
    needs: deploy-dev
    uses: ./.github/workflows/deploy-env.yml
    with:
      env: prod
      image_tag: ${{ github.sha }} # the SAME tag dev ran, nothing rebuilt
